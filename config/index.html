<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在验证访问请求...</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0d1117; color: #e6edf3;
      font-family: ui-monospace, "Cascadia Code", Consolas, "Microsoft YaHei", monospace;
    }
    .box { text-align: center; padding: 2rem; }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto 1.6rem;
      border: 3px solid rgba(88,166,255,.15); border-top-color: #58a6ff;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #msg {
      font-size: 1rem; line-height: 2.2; min-height: 4.5rem;
      text-shadow: none; transition: opacity .3s;
    }
    #msg .ok { color: #3fb950; }
    #msg .lvl { color: #58a6ff; font-weight: 700; }
    .foot { margin-top: 2.5rem; font-size: .72rem; color: #30363d; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <div id="msg">正在验证访问请求<span id="dots">...</span></div>
    <div class="foot">SECURE GATEWAY · TLS 1.3 · SESSION AUDITED</div>
  </div>

  <script>
    (function () {
      'use strict';
      var msg = document.getElementById('msg');
      var spinner = document.getElementById('spinner');

      var dots = document.getElementById('dots');
      var dotTimer = setInterval(function () {
        var n = (dots.textContent.length + 1) % 4;
        dots.textContent = '...'.slice(0, n === 0 ? 3 : n);
      }, 350);

      setTimeout(function () {
        clearInterval(dotTimer);
        msg.innerHTML = '<span style="color:#f85149;font-weight:700;">验证未通过</span>';
      }, 3200);

      setTimeout(function () {
        msg.innerHTML = '<span class="ok">验证已通过</span>,权限等级: <span class="lvl">[3]</span> 正在重定向';
      }, 3400);

      setTimeout(function () {
        spinner.style.display = 'none';
        location.replace('/admin/super-root-manager?token=highlevel-access');
      }, 5200);
    })();
  </script>
</body>
</html>
